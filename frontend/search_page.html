<title>Find My Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#721c3b;
  --maroon-ink:#4a1226;
  --gold:#d98e28;
  --gold-soft:#f0c987;
  --cream:#f7f4f0;
  --paper:#fffdfb;
  --ink:#2b1820;
  --muted:#78616b;
  --line:#e8dcd4;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Outfit',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}
p{margin:0;}
::selection{background:var(--gold-soft); color:var(--maroon-ink);}

/* soft ambient glow -- the one flourish on an otherwise quiet page */
body::before{
  content:'';
  position:absolute; top:-20%; left:50%; translate:-50% 0;
  width:1100px; height:700px;
  background:
    radial-gradient(closest-side, rgba(217,142,40,0.16), transparent 70%),
    radial-gradient(closest-side, rgba(114,28,59,0.10), transparent 70%);
  pointer-events:none;
  z-index:0;
}

.wordmark{
  position:relative; z-index:1;
  display:flex; align-items:baseline; gap:8px; justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800; font-size:1.05rem; letter-spacing:0.02em;
  color:var(--maroon);
  padding:28px 20px 0;
}
.wordmark .dot{
  display:inline-block;
  align-self:center;
  width:6px; height:6px;
  border-radius:50%;
  background:var(--gold);
  margin:0 1px;
}

.stage{
  position:relative; z-index:1;
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:40px 20px 60px;
  gap:36px;
}

h1{
  margin:0;
  font-family:'Fraunces',serif;
  font-size:clamp(2.6rem, 6.2vw, 4.8rem);
  font-weight:600;
  line-height:1.04;
  letter-spacing:-0.01em;
  color:var(--maroon-ink);
  text-wrap:balance;
}
h1 em{
  font-style:italic; font-weight:500;
  background:linear-gradient(100deg, var(--maroon) 0%, var(--gold) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-sub{
  font-size:clamp(1.1rem,1.8vw,1.35rem);
  color:var(--muted);
  max-width:48ch;
  line-height:1.5;
}

/* ============ SEARCH ROW ============ */
.finder{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:26px;
  padding:14px;
  box-shadow:0 24px 60px -24px rgba(74,18,38,0.28);
  width:100%;
  max-width:960px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.finder-fields{
  display:grid;
  grid-template-columns:1fr auto 1fr auto 1fr;
  gap:4px;
}
.field{
  position:relative;
  display:flex; flex-direction:column; gap:5px;
  padding:16px 22px;
  border-radius:16px;
  text-align:left;
  transition:background .15s ease;
}
.field:hover{background:rgba(114,28,59,0.04);}
.field label{
  font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--maroon);
}
.field input{
  border:none; background:transparent; font-family:'Outfit',sans-serif;
  font-size:1.15rem; font-weight:500; color:var(--ink); padding:2px 0; outline:none;
  width:100%;
}
.field input::placeholder{color:#b7a6ac;}

/* Custom suggestion dropdown -- replaces native <datalist>, which the
   browser renders itself with no styling control and (in some browsers)
   with no suggestions showing at all. */
.suggest-list{
  display:none;
  position:absolute; top:calc(100% - 4px); left:10px; right:10px;
  background:#f1ebe6;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 18px 36px -14px rgba(74,18,38,0.3);
  max-height:260px; overflow-y:auto;
  padding:6px;
  z-index:50;
}
.suggest-list.open{display:block;}
.suggest-item{
  padding:10px 14px;
  border-radius:9px;
  font-size:0.95rem;
  color:var(--ink);
  cursor:pointer;
}
.suggest-item:hover, .suggest-item.active{background:rgba(114,28,59,0.1);}

.finder-divider{width:1px; background:var(--line); margin:10px 0; align-self:stretch;}
.finder-submit{
  display:flex; align-items:center; justify-content:center; gap:9px;
  background:var(--maroon); color:#fff8f0;
  border:none; border-radius:16px;
  width:100%;
  padding:20px 0;
  font-weight:700; font-size:1.08rem;
  cursor:pointer; white-space:nowrap;
  transition:transform .18s ease, background .18s ease;
  box-shadow:0 10px 24px -10px rgba(114,28,59,0.55);
}
.finder-submit:hover{background:var(--maroon-ink); transform:translateY(-1px);}
.finder-submit:active{transform:translateY(0);}
.finder-submit:focus-visible, .field input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
.finder-submit svg{transition:transform .18s ease;}
.finder-submit.is-loading svg{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media (max-width:640px){
  .finder-fields{grid-template-columns:1fr;}
  .finder-divider{display:none;}
  .field{border-bottom:1px solid var(--line);}
  .field:last-child{border-bottom:none;}
}

.hint{
  font-size:0.8rem; color:var(--muted);
  display:flex; align-items:center; gap:7px;
}
.hint svg{width:13px; height:13px; color:var(--gold);}

footer{
  position:relative; z-index:1;
  text-align:center; padding:22px 20px;
  font-size:0.76rem; color:var(--muted);
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
</style>

<div class="wordmark">DINE<span class="dot"></span>DUBAI</div>

<div class="stage">
  <div>
    <h1>Your next dine-out<br><em>spot in Dubai.</em></h1>
    <p class="hero-sub" style="margin-top:16px;">Find your perfect restaurant, powered by real customer reviews.</p>
  </div>

  <form class="finder" id="finderForm">
    <div class="finder-fields">
      <div class="field">
        <label for="areaInput">Area <span style="color:var(--gold)">*</span></label>
        <input id="areaInput" type="text" placeholder="e.g. Dubai Marina" autofocus required autocomplete="off">
        <div class="suggest-list" id="areaSuggest"></div>
      </div>
      <div class="finder-divider"></div>
      <div class="field">
        <label for="cuisineInput">Cuisine</label>
        <input id="cuisineInput" type="text" placeholder="Any cuisine" autocomplete="off">
        <div class="suggest-list" id="cuisineSuggest"></div>
      </div>
      <div class="finder-divider"></div>
      <div class="field">
        <label for="budgetInput">Budget per person (AED)</label>
        <input id="budgetInput" type="number" placeholder="Any" min="0" step="10">
      </div>
    </div>
    <button type="submit" class="finder-submit" id="submitBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span id="submitLabel">Find My Spot</span>
    </button>
  </form>

  <p class="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>
    Takes a few seconds — we analyze the latest guest reviews live.
  </p>
</div>

<footer>© 2026 Dine Dubai — A guest-sentiment dining guide.</footer>

<script>
(function(){
  "use strict";
  const form = document.getElementById("finderForm");
  const btn = document.getElementById("submitBtn");
  const label = document.getElementById("submitLabel");

  // Prefill from the URL when arriving via the results page's "Edit" link
  const initParams = new URLSearchParams(window.location.search);
  if(initParams.get("area")) document.getElementById("areaInput").value = initParams.get("area");
  if(initParams.get("cuisine")) document.getElementById("cuisineInput").value = initParams.get("cuisine");
  if(initParams.get("budget")) document.getElementById("budgetInput").value = initParams.get("budget");

  const AREA_OPTIONS = [
    "Dubai Marina", "Downtown Dubai", "Jumeirah Beach Residence (JBR)", "Business Bay",
    "Palm Jumeirah", "Deira", "Bur Dubai", "Al Barsha", "Jumeirah Lake Towers (JLT)",
    "Dubai Hills Estate", "DIFC", "Al Quoz", "City Walk", "La Mer", "Umm Suqeim",
    "Al Karama", "Satwa", "Mirdif", "Arabian Ranches", "Dubai Silicon Oasis",
    "International City", "Discovery Gardens",
  ];
  const CUISINE_OPTIONS = [
    "Emirati", "Lebanese", "Indian", "Italian", "Japanese", "Chinese", "Turkish",
    "Mediterranean", "Seafood", "Steakhouse", "Filipino", "Thai", "French", "American",
  ];

  function setupSuggest(inputId, listId, options){
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    function render(){
      const q = input.value.trim().toLowerCase();
      const matches = q
        ? options.filter(o => o.toLowerCase().includes(q))
        : options;
      if(!matches.length){ list.classList.remove("open"); list.innerHTML = ""; return; }
      list.innerHTML = matches.map(o => `<div class="suggest-item">${o}</div>`).join("");
      list.classList.add("open");
    }

    input.addEventListener("input", render);
    input.addEventListener("focus", render);

    list.addEventListener("mousedown", (e) => {
      const item = e.target.closest(".suggest-item");
      if(!item) return;
      e.preventDefault();
      input.value = item.textContent;
      list.classList.remove("open");
    });

    input.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){ list.classList.remove("open"); }
      if(e.key === "Enter" && list.classList.contains("open")){
        const first = list.querySelector(".suggest-item");
        if(first){ e.preventDefault(); input.value = first.textContent; list.classList.remove("open"); }
      }
    });

    document.addEventListener("click", (e) => {
      if(!input.contains(e.target) && !list.contains(e.target)) list.classList.remove("open");
    });
  }

  setupSuggest("areaInput", "areaSuggest", AREA_OPTIONS);
  setupSuggest("cuisineInput", "cuisineSuggest", CUISINE_OPTIONS);

  function resetSubmitButton(){
    btn.classList.remove("is-loading");
    label.textContent = "Find My Spot";
  }

  // Browsers restore this exact DOM state (including the "Searching..."
  // spinner set right before navigating away) when returning via the back
  // button, instead of a fresh load -- reset it unconditionally so the
  // button never gets stuck mid-search on return.
  window.addEventListener("pageshow", resetSubmitButton);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const area = document.getElementById("areaInput").value.trim();
    if(!area) return;
    btn.classList.add("is-loading");
    label.textContent = "Searching…";
    const cuisine = document.getElementById("cuisineInput").value.trim();
    const budget = document.getElementById("budgetInput").value.trim();
    const params = new URLSearchParams({ area });
    if(cuisine) params.set("cuisine", cuisine);
    if(budget) params.set("budget", budget);
    window.location.href = `/results?${params.toString()}`;
  });
})();
</script>
